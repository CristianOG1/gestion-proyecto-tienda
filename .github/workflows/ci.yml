name: CI/CD Tienda y Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      STRAPI_HOST: "https://mi-tienda-backend-y9xx.onrender.com"
      STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Instalar dependencias (Strapi)
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Construir proyecto (Strapi)
        working-directory: backend
        run: pnpm run build

      - name: Instalar dependencias (Next.js)
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Despertar backend en Render
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$STRAPI_HOST/_health" || true)
            echo "Intento $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              echo "Backend despierto"
              exit 0
            fi
            sleep 10
          done
          echo "El backend de Render no despertó a tiempo"
          exit 1

      - name: Lint y TypeScript (Next.js)
        working-directory: web
        run: |
          pnpm lint || true
          pnpm exec tsc --noEmit || true

      - name: Construir proyecto (Next.js)
        working-directory: web
        run: pnpm run build

  publicar_docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Construir y publicar imagen web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          # CAMBIA ESTO POR TU USUARIO REAL DE DOCKER HUB:
          tags: TU_USUARIO_DOCKERHUB/control-visitas:latest
          build-args: |
            STRAPI_HOST=https://mi-tienda-backend-y9xx.onrender.com