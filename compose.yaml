services:
  web:
    build:
      context: ./web
      args:
        STRAPI_HOST: https://mi-tienda-backend-y9xx.onrender.com
      secrets:
        - strapi_token
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env.local
    environment:
      STRAPI_HOST: http://backend:8888
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8888:8888"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8888/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

secrets:
  strapi_token:
    environment: "STRAPI_TOKEN"