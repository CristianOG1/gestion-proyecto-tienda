services:
  web:
    build:
      context: ./web
      args:
        STRAPI_HOST: https://mi-tienda-backend-y9xx.onrender.com
      secrets:
        - strapi_token
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env.local
    environment:
      STRAPI_HOST: http://backend:8888
      STRAPI_TOKEN: ${STRAPI_TOKEN}
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8888:8888"
    env_file:
      - ./backend/.env

secrets:
  strapi_token:
    environment: "STRAPI_TOKEN"